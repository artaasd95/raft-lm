[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raft-lm"
version = "0.2.1"
description = "Risk-Aware Fine-Tuning for training LLMs on financial risk-aware decision making"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "gymnasium>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-PyYAML",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-autodoc-typehints>=2.0",
]
storage = [
    "boto3>=1.28.0",
    "paramiko>=3.0.0",
]
hf = [
    "transformers>=4.41",
    "datasets",
    "peft",
    "huggingface_hub",
    "safetensors",
    "trl",
]
qlora = [
    "transformers>=4.41",
    "peft",
    "bitsandbytes",
    "accelerate",
    "safetensors",
    "huggingface_hub",
]
unsloth = [
    "unsloth",
    "transformers>=4.41",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "safetensors",
    "huggingface_hub",
]
ray = [
    "ray[train]>=2.9.0",
]
wandb = [
    "wandb>=0.16.0",
]
comet = [
    "comet_ml>=3.35.0",
]

[project.scripts]
raft-train = "application.entrypoints:train_main"
raft-eval = "application.entrypoints:eval_main"
raft-search = "application.entrypoints:search_main"
raft-build-dataset = "application.entrypoints:build_dataset_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: requires CUDA GPU",
    "hf: requires transformers+peft installed",
    "slow: multi-second learning smoke",
    "ray: requires ray installed",
]
addopts = "-m 'not gpu and not ray'"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks", "data", "experiments/results", "docs/_build"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"src/**/__init__.py" = ["F403"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["notebooks/", "tests/", "scripts/"]
