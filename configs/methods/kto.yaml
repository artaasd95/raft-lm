method: kto
experiment_name: kto_smoke
description: KTO unpaired preference smoke
algorithm:
  beta: 0.1
training:
  backend: kto
  num_epochs: 1
  seed: 42
  device: cpu
  optimizer:
    type: Adam
    lr: 0.0002
    weight_decay: 0.0
  loss:
    type: CrossEntropyLoss
output:
  results_dir: experiments/results
