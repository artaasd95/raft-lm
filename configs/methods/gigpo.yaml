method: gigpo
experiment_name: gigpo_smoke
description: Group-in-Group Policy Optimization smoke
algorithm:
  group_size: 2
  step_reward_gamma: 0.95
  episode_reward_weight: 1.0
  step_reward_weight: 1.0
generation:
  backend: mock
training:
  backend: gigpo
  num_epochs: 1
  seed: 42
  device: cpu
reward:
  name: composite
  components:
    - name: task_accuracy
      weight: 1.0
    - name: risk_cvar
      weight: 0.3
      params:
        alpha: 0.05
output:
  results_dir: experiments/results
