# Local benchmark and demo only — NOT for production SaaS deployment.
services:
  benchmark:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env.example
    volumes:
      - ../docs/benchmarks/results:/app/docs/benchmarks/results
    command: ["python", "-m", "src.evals.benchmark_runner"]

  demo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env.example
    ports:
      - "8501:8501"
    volumes:
      - ../docs/benchmarks/results:/app/docs/benchmarks/results
    command:
      [
        "streamlit",
        "run",
        "src/demo/streamlit_app.py",
        "--server.address",
        "0.0.0.0",
      ]
